name: Wells Fargo Task 2 CI

on:
  push:
    branches: [ main, master, flow, feature/** ]
  pull_request:
    branches: [ main, master, flow ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean test
